<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your cart — Mayilan</title>
<style>
  body { margin: 0; background: #faf7f2; color: #2a2420; font: 17px/1.5 Georgia, "Times New Roman", serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .note { color: #6b5d52; margin: 0 0 24px; font-size: 15px; }
  .item { display: grid; grid-template-columns: 96px 1fr; gap: 16px; padding: 16px 0; border-top: 1px solid #e6ddd2; }
  .item img { width: 96px; height: 120px; object-fit: cover; border-radius: 4px; background: #eee5da; }
  .item h2 { font-size: 16px; font-weight: normal; margin: 0 0 6px; }
  .price { font-size: 18px; }
  .price s { color: #8c7f74; font-size: 15px; margin-left: 6px; }
  .qty { color: #6b5d52; font-size: 14px; }
  .total { display: flex; justify-content: space-between; border-top: 1px solid #e6ddd2; padding: 16px 0; font-size: 19px; }
  .pay { display: block; text-align: center; background: #8a3b12; color: #fff; text-decoration: none; padding: 14px; border-radius: 6px; font-size: 18px; margin: 4px 0 10px; }
  .pay.alt { background: transparent; color: #8a3b12; border: 1px solid #8a3b12; font-size: 16px; padding: 10px; }
  .small { color: #6b5d52; font-size: 14px; }
  a { color: #8a3b12; }
</style>
</head>
<body>
<main>
  <h1>Your cart</h1>
  <p class="note">Each Mayilan saree is one of a kind. Checkout and payment happen securely on our Etsy shop.</p>
  <div id="items"></div>
  <div class="total" id="total" hidden><span>Total</span><span id="sum"></span></div>
  <div id="buttons"><a class="pay" href="https://mayilan.etsy.com">Check out on Etsy</a></div>
  <p class="small">Questions? Email <span>sales@unimayilan.com</span>. Ready to ship from McKinney, Texas.</p>
</main>
<script>
// Meta Shops checkout URL: /checkout/?products=<SKU>:<qty>,<SKU>:<qty>&coupon=<code>
// Shows the chosen sarees as a cart; each one is paid for on its Etsy listing.
(async () => {
  const usd = n => "$" + n.toFixed(2);
  const wanted = (new URLSearchParams(location.search).get("products") || "")
    .split(",").map(p => p.split(":")).filter(p => p[0] && p[0].trim())
    .map(([sku, qty]) => [decodeURIComponent(sku.trim()), Math.max(1, parseInt(qty, 10) || 1)]);
  let map = {};
  try { map = await (await fetch("products.json", { cache: "no-store" })).json(); } catch (e) {}
  const found = wanted.filter(([sku]) => map[sku]);
  const items = document.getElementById("items"), buttons = document.getElementById("buttons");
  if (!found.length) {
    items.innerHTML = '<p>This saree is no longer available. Please see our other sarees on Etsy.</p>';
    buttons.innerHTML = '<a class="pay" href="https://mayilan.etsy.com">Browse the Mayilan shop</a>';
    return;
  }
  let sum = 0;
  items.innerHTML = "";
  buttons.innerHTML = "";
  found.forEach(([sku, qty], i) => {
    const p = map[sku];
    sum += p.sale_price;  // one of a kind: quantity is always 1
    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = '<img alt=""><div><h2></h2><div class="price"></div><div class="qty">Qty 1 · one of a kind</div></div>';
    row.querySelector("img").src = p.image;
    row.querySelector("h2").textContent = p.title;
    row.querySelector(".price").innerHTML = usd(p.sale_price) + (p.price > p.sale_price ? "<s>" + usd(p.price) + "</s>" : "");
    items.appendChild(row);
    const a = document.createElement("a");
    a.className = i ? "pay alt" : "pay";
    a.href = p.url;
    a.textContent = found.length > 1 ? "Check out on Etsy: " + p.title.split(", ").slice(-2, -1)[0] : "Check out on Etsy";
    buttons.appendChild(a);
  });
  document.getElementById("sum").textContent = usd(sum);
  document.getElementById("total").hidden = false;
})();
</script>
</body>
</html>
